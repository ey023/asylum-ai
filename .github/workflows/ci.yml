name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  medical-baseline:
    name: medical-contradiction-detection (stub, stdlib only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-contradiction-detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke tests
        run: python test_baseline.py
      - name: End-to-end stub run
        run: python run_baseline.py --synthetic-pairs 8 --results /tmp/results.jsonl

  legal-benchmark:
    name: plugin-asylum-immigration (sourcing invariant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-asylum-immigration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin.json
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json')); print('plugin.json OK')"
      - name: Validate country-conditions benchmark
        run: python benchmark/check_benchmark.py
